  price_source_organization: Department of Export Agriculture, Sri Lanka - Economic Research Unit
  unit: LKR/kg
  selected_method: separate grade-specific Ridge over next-observation log return
  evidence_verdict: MIXED
  persistence_role: required comparator and transparent fallback baseline

grade_routing:
  V3 Grade 1: {price_grade: Grade 1, model_scope: separate_grade_1_ridge}
  V3 Grade 2: {price_grade: Grade 2, model_scope: separate_grade_2_ridge}

direction_rule:
  source: frozen Phase 5 rule
  method: round reference price and forecast price to 0.01 LKR; UP if forecast is greater, DOWN if lower, FLAT if equal
  price_resolution_lkr: 0.01
  near_flat_band: null
  labels: [DOWN, FLAT, UP]

signal_rule:
  default: LIMITED_SIGNAL
  high_uncertainty: validation-derived interval includes prices on both sides of the reference price
  relative_support: Ridge is documented as better than persistence for the supplied evaluation context and the interval does not cross the reference price
  persistence_better: always LIMITED_SIGNAL unless the interval-crossing rule produces HIGH_UNCERTAINTY
  numeric_confidence_probability: prohibited

decision_categories:
  reject: REJECT
  uncertain_grade: UNCERTAIN_GRADE
  conflicting_views: CONFLICTING_SAMPLE_VIEWS
  price_unavailable: PRICE_DATA_UNAVAILABLE
  forecast_unavailable: FORECAST_UNAVAILABLE
  upward: UPWARD_PRICE_OUTLOOK
  downward: DOWNWARD_PRICE_OUTLOOK
  flat: FLAT_PRICE_OUTLOOK
  high_uncertainty: HIGH_UNCERTAINTY_OUTLOOK

uncertainty_handling:
  rejected_has_market_output: false
  uncertain_has_market_output: false
  interval_label: validation-derived forecast interval
  interval_is_probability_claim: false
  confidence_is_probability: false

aggregation:
  methods: [majority_vote, confidence_weighted]
  route_only_when: at least one accepted view exists, all accepted views have one grade, and majority and confidence-weighted grades agree
  conflict_state: CONFLICTING_SAMPLE_VIEWS
  rejected_views_are_preserved: true

historical_scenarios:
  positive_decisions_path: ml/grading_forecast/berry_grading/evaluation/v3_phase3_followup/phase2_positive_test_decisions.csv
